services:
  roboplanter-mcp:
    build:
      context: ../..
      dockerfile: integrations/cloud/Dockerfile
    env_file:
      - ${ROBOPLANTER_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:18765:8765"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    mem_reservation: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
